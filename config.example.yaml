# ============================================================
# 通话录音档案库 - 配置样例
# 复制为 config.yaml 后按本机实际情况修改
# ============================================================

# 通话录音根目录（递归扫描）。"." 表示项目根目录
recordings_dir: "."

# 扫描时排除的目录名（避免把工程自身目录里的音频当录音）
exclude_dirs: ["src", "web", "data", "logs", "scripts", ".git", ".venv", "__pycache__", "docs"]

# 音频工作目录（规范化后的 16k 单声道 wav 缓存）
work_dir: "data/work"

# 数据库文件
db_path: "data/archive.db"

# 音色导出目录（供千问 TTS 使用）
voices_dir: "data/voices"

# 支持的录音扩展名
audio_extensions: [".mp3", ".wav", ".m4a", ".amr", ".ogg", ".opus", ".flac", ".aac", ".mp4", ".wma", ".3gp", ".silk", ".slk"]

# ---------- 文件名解析 ----------
# 从通话录音文件名提取「时间/对方姓名/号码」，按顺序尝试，命名组 name/date/time/phone 被采纳。
# 不同手机命名千差万别，按你的文件名习惯增删正则。
filename_patterns:
  - '(?P<date>\d{4}[-_/]\d{1,2}[-_/]\d{1,2})[ _]*(?P<time>\d{1,2}[-_:]?\d{2})?.*?(?P<name>[\u4e00-\u9fa5]{2,4})?'
  - '(?P<name>[\u4e00-\u9fa5]{2,4})?.*?(?P<date>\d{4}[-_/]\d{1,2}[-_/]\d{1,2})[ _]*(?P<time>\d{1,2}[-_:]?\d{2})?'
  - '(?P<date>\d{8})[ _]?(?P<time>\d{4,6})'
  - '(?P<phone>1[3-9]\d{9})'
fallback_to_mtime: true

# ---------- ASR / 说话人分离 ----------
asr:
  model: "iic/SenseVoiceSmall"   # ModelScope 别名，首次运行自动缓存到 ~/.cache/modelscope
  vad_model: "fsmn-vad"
  punc_model: "ct-punc"
  spk_model: "cam++"
  device: "cuda"                 # 显存不足改 "cpu"
  workers: 1                     # 并行转写进程数（每个独立占显存/内存；OOM 或内存吃紧改 1）
  num_speakers: 2                # 双人通话=2
  min_embed_ms: 1500             # 短于此的段不做声纹
  me_threshold: 0.62             # 判定「我」的余弦相似度下限
  cluster_cut_dist: 0.62
  cluster_merge_sim: 0.8         # 两簇质心相似度高于此判单人
  me_enroll_calls: 30

# ---------- 本地 LLM 摘要 ----------
llm:
  base_url: "http://localhost:11434/v1"   # Ollama；LM Studio 用 http://localhost:1234/v1
  api_key: "ollama"
  model: "qwen2.5:3b"                      # 任意本地 chat 模型
  temperature: 0.3
  max_tokens: 1024
  enabled: true

# ---------- Qwen3 精修（可选） ----------
qwen:
  enabled: false
  python: "path/to/vllm-env/python.exe"     # 能跑 qwen_asr SDK 的环境
  asr_model_path: "path/to/Qwen3-ASR-1.7B"
  aligner_model_path: "path/to/Qwen3-ForcedAligner-0.6B"

# ---------- Web 驾驶舱 ----------
web:
  host: "127.0.0.1"
  port: 8760

# ---------- 网络代理 ----------
# 模型走 ModelScope 国内源即可；仅访问 GitHub/HF 时开启
proxy:
  enabled: false
  http: "http://127.0.0.1:7890"
  https: "http://127.0.0.1:7890"
  model_hub: "modelscope"
