<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通话档案</title>
<script src="/static/vendor/echarts.min.js"></script>
<style>
@font-face{font-family:'Space Grotesk';src:url('/static/vendor/fonts/space-grotesk-400.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Space Grotesk';src:url('/static/vendor/fonts/space-grotesk-500.woff2') format('woff2');font-weight:500}
@font-face{font-family:'Space Grotesk';src:url('/static/vendor/fonts/space-grotesk-700.woff2') format('woff2');font-weight:700}
:root{
  --bg:#131417;--panel:#1a1c20;--panel2:#20232a;--line:#2b2e35;
  --txt:#e9e6df;--dim:#8b8f97;--faint:#5c6067;
  --amber:#e8a33d;--amber-dim:#8a6224;--teal:#63b3a5;--slate:#7f8ea3;--sand:#c9b28a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.7 "Microsoft YaHei",system-ui,sans-serif}
.num{font-family:'Space Grotesk',system-ui;font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{display:flex;align-items:baseline;gap:26px;padding:18px 28px 14px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:9}
.logo{font-size:16px;font-weight:700;letter-spacing:.06em;display:flex;align-items:center;gap:9px}
.logo .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 10px 1px rgba(232,163,61,.55);align-self:center}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--dim);padding:6px 13px;cursor:pointer;
  font-size:14px;font-family:inherit;border-radius:6px;position:relative}
nav button:hover{color:var(--txt)}
nav button.on{color:var(--txt)}
nav button.on::after{content:'';position:absolute;left:13px;right:13px;bottom:-2px;
  height:2px;background:var(--amber)}
#status{margin-left:auto;font-size:12px;color:var(--faint)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

main{padding:26px 28px 60px;max-width:1240px;margin:0 auto}
h2{font-size:13px;font-weight:500;color:var(--faint);margin:34px 0 12px}

/* ---------- river (hero) ---------- */
#river-wrap{position:relative;margin-top:6px}
#river{width:100%;height:150px;display:block;cursor:crosshair}
#river-tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:4px 10px;font-size:12px;color:var(--txt);opacity:0;transition:opacity .12s;white-space:nowrap}
#river-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:2px}

/* ---------- stat line ---------- */
.statline{display:flex;flex-wrap:wrap;gap:44px;margin:26px 2px 0;padding:0}
.stat b{display:block;font-size:34px;font-weight:500;line-height:1.15;color:var(--txt)}
.stat span{font-size:12px;color:var(--faint)}
.stat.hot b{color:var(--amber)}

/* ---------- charts ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--dim)}
.chart{height:270px}

/* ---------- search ---------- */
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select{background:var(--panel);border:1px solid var(--line);color:var(--txt);
  padding:8px 12px;border-radius:8px;font-size:13px;font-family:inherit}
input:focus,select:focus{border-color:var(--amber-dim)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 18px;
  border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit}
.btn:hover{border-color:var(--amber-dim);color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--faint);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--panel)}
tr.row:hover{background:#1d2026;cursor:pointer}
td.time{color:var(--amber);white-space:nowrap}
td.sum{max-width:360px;color:var(--dim)}
td.fn{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--faint);font-size:12px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;
  background:var(--panel2);color:var(--slate);border:1px solid var(--line)}
.pill.done{color:var(--teal);border-color:#2c4a44}
.pill.err{color:#d96c5f;border-color:#4a2c28}
.pager{display:flex;gap:12px;align-items:center;color:var(--faint);margin-top:12px;font-size:13px}

/* ---------- call detail ---------- */
#detail{margin-top:18px;border-left:2px solid var(--amber)}
#detail .head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
#detail .head b{font-size:18px;font-weight:500}
audio{width:100%;margin:12px 0;height:36px}
.summary{background:var(--panel2);border-radius:8px;padding:12px 14px;margin:10px 0;font-size:13px}
.summary .todos{margin-top:8px;color:var(--dim)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;
  background:#23262e;color:var(--slate);margin:2px 4px 0 0}
#seglist{max-height:460px;overflow:auto;margin-top:14px;padding-right:6px}
.seg{max-width:78%;margin:8px 0;padding:8px 12px;border-radius:10px;background:var(--panel2)}
.seg .who{font-size:11px;color:var(--faint);margin-bottom:2px}
.seg .t{font-size:11px;color:var(--faint);margin-left:8px}
.seg.me{margin-left:auto;border-right:2px solid var(--amber)}
.seg.me .who{color:var(--amber)}
.seg.other{border-left:2px solid var(--teal)}
.seg.other .who{color:var(--teal)}
.seg.unknown{border-left:2px solid var(--faint)}

/* ---------- graph / voices ---------- */
#graphbox{position:relative;height:640px;border:1px solid var(--line);border-radius:12px;
  background:radial-gradient(1100px 620px at 50% 44%,#15171d 0%,#0c0d10 72%);overflow:hidden}
#gx{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#gx.dragging{cursor:grabbing}
.g-hud{position:absolute;z-index:2;font-size:11px;color:var(--dim);pointer-events:none}
#g-legend{top:12px;left:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
#g-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
#g-legend i.dia{border-radius:0;transform:rotate(45deg)}
#g-count{top:12px;right:14px;font-family:'Space Grotesk';font-variant-numeric:tabular-nums}
#g-tip{position:absolute;z-index:3;pointer-events:none;background:rgba(29,32,38,.95);border:1px solid var(--line);
  border-radius:6px;padding:3px 9px;font-size:12px;opacity:0;transition:opacity .12s;white-space:nowrap}
#g-card{position:absolute;left:14px;bottom:14px;z-index:3;width:260px;display:none;
  background:rgba(24,26,30,.93);border:1px solid var(--line);border-left:2px solid var(--amber);
  border-radius:10px;padding:13px 15px;backdrop-filter:blur(8px)}
#g-card.show{display:block}
#g-card .nm{font-size:16px;font-weight:500}
#g-card .kv{font-size:12px;color:var(--dim);margin-top:2px}
#g-card .kv b{color:var(--txt);font-family:'Space Grotesk';font-weight:500}
#g-card .btn{margin-top:10px;padding:5px 12px;font-size:12px}
.vrow{display:flex;gap:16px;align-items:flex-start;padding:16px 4px;border-bottom:1px solid var(--line)}
.vrow .av{width:44px;height:44px;flex:none;border-radius:50%;background:var(--panel2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--teal);font-family:'Space Grotesk'}
.vrow audio{width:300px;height:32px}
.vmeta{font-size:12px;color:var(--faint)}
.evrow{padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px}
.evrow .t{color:var(--faint);font-family:'Space Grotesk';font-size:12px;margin-right:10px}
a{color:var(--slate)}
.muted{color:var(--faint)}
@media (max-width:860px){.g2{grid-template-columns:1fr}.statline{gap:22px}header{gap:12px;flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot"></span>通话档案</div>
  <nav id="nav"></nav>
  <div id="status"></div>
</header>
<main id="view"></main>
<script>
const V=document.getElementById('view'), nav=document.getElementById('nav');
const pages=[['dash','档案总览'],['calls','找通话'],['graph','关系图谱'],['voices','音色库'],['sources','录音库']];
let cur='dash';
function renderNav(){nav.innerHTML='';pages.forEach(([k,t])=>{const b=document.createElement('button');
  b.textContent=t;b.className=cur===k?'on':'';b.setAttribute('aria-current',cur===k?'page':'false');
  b.onclick=()=>{cur=k;renderNav();P[cur]()};nav.appendChild(b)})}
async function J(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status+' '+u);return r.json()}
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dur=s=>s==null?'—':(s>=60?Math.floor(s/60)+'分'+String(Math.round(s%60)).padStart(2,'0')+'秒':Math.round(s)+'秒');
const fmt=ts=>ts?ts.replace('T',' '):'';
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= 档案总览 ================= */
async function dash(){
  V.innerHTML='<div class="muted">正在载入档案…</div>';
  const [ov,tl,hm,cts,dh,prog]=await Promise.all([
    J('/api/overview'),J('/api/stats/timeline?bucket=day'),J('/api/stats/heatmap'),
    J('/api/stats/contacts?limit=10'),J('/api/stats/duration'),J('/api/progress')]);
  V.innerHTML=`
  <div id="river-wrap"><canvas id="river" width="2360" height="300"></canvas><div id="river-tip"></div>
    <div id="river-axis"></div></div>
  <div class="statline">
    <div class="stat hot"><b class="num">${ov.total_calls}</b><span>通电话</span></div>
    <div class="stat"><b class="num">${ov.contacts}</b><span>位联系人</span></div>
    <div class="stat"><b class="num">${ov.hours}<small style="font-size:15px">h</small></b><span>通话时长</span></div>
    <div class="stat"><b class="num" style="font-size:19px;line-height:2.1">${fmt(ov.first_call).slice(0,10)} — ${fmt(ov.last_call).slice(0,10)}</b><span>时间跨度</span></div>
  </div>
  <h2>分布</h2>
  <div class="grid g2">
    <div class="card"><h3>什么时候打的（星期 × 小时）</h3><div id="ch2" class="chart"></div></div>
    <div class="card"><h3>打得最多的人</h3><div id="ch3" class="chart"></div></div>
    <div class="card"><h3>通话时长分布</h3><div id="ch4" class="chart"></div></div>
    <div class="card"><h3>处理进度</h3><div style="padding:8px 2px">${
      Object.entries(prog).map(([k,v])=>`<span class="tag">${k==='pending'?'待处理':k==='transcribed'?'已转写':k==='analyzed'?'已摘要':k==='normalized'?'已规范化':k==='error'?'出错':esc(k)} ${v}</span>`).join('')}
      <div class="muted" style="font-size:12px;margin-top:10px">后台跑批持续进行中，此页每 5 秒自动刷新。</div></div></div>
  </div>`;
  drawRiver(tl);
  const axis={axisLine:{lineStyle:{color:'#2b2e35'}},axisLabel:{color:'#8b8f97'}};
  const wd=['周日','周一','周二','周三','周四','周五','周六'];
  const data=[];for(let i=0;i<7;i++)for(let h=0;h<24;h++)data.push([h,i,hm[i][h]]);
  echarts.init(document.getElementById('ch2')).setOption({backgroundColor:'transparent',tooltip:{},
    grid:{left:42,right:12,top:8,bottom:52},
    xAxis:{type:'category',data:[...Array(24).keys()],...axis},yAxis:{type:'category',data:wd,...axis},
    visualMap:{min:0,max:Math.max(1,...hm.flat()),calculable:true,orient:'horizontal',left:'center',bottom:0,
      inRange:{color:['#1a1c20','#4a3a22','#8a6224','#e8a33d']},textStyle:{color:'#8b8f97'}},
    series:[{type:'heatmap',data}]});
  echarts.init(document.getElementById('ch3')).setOption({backgroundColor:'transparent',tooltip:{},
    grid:{left:118,right:28,top:6,bottom:20},
    xAxis:{type:'value',...axis,splitLine:{lineStyle:{color:'#20232a'}}},
    yAxis:{type:'category',data:cts.map(x=>x.name).reverse(),...axis},
    series:[{type:'bar',data:cts.map(x=>x.calls).reverse(),barWidth:10,
      itemStyle:{color:'#63b3a5',borderRadius:[0,4,4,0]},label:{show:true,position:'right',color:'#8b8f97'}}]});
  echarts.init(document.getElementById('ch4')).setOption({backgroundColor:'transparent',tooltip:{},
    grid:{left:42,right:12,top:8,bottom:26},
    xAxis:{type:'category',data:dh.map(x=>x.label),...axis},
    yAxis:{type:'value',...axis,splitLine:{lineStyle:{color:'#20232a'}}},
    series:[{type:'bar',data:dh.map(x=>x.count),barWidth:22,itemStyle:{color:'#8a6224',borderRadius:[4,4,0,0]}}]});
}

/* 通话长河：每天一根琥珀刻度，点击跳到该日检索 */
function drawRiver(tl){
  const cv=document.getElementById('river'), tip=document.getElementById('river-tip');
  const dpr=devicePixelRatio||1, W=cv.clientWidth, H=150;
  cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  if(!tl.length)return;
  const t0=new Date(tl[0].bucket+'T00:00:00'), t1=new Date(tl[tl.length-1].bucket+'T00:00:00');
  const days=Math.max(1,Math.round((t1-t0)/864e5)+1);
  const byDay={};tl.forEach(x=>byDay[x.bucket]=x.calls);
  const max=Math.max(...tl.map(x=>x.calls),1);
  const bw=Math.max(1,Math.min(4,W/days-1));
  function frame(i){ // 画前 i 根
    g.clearRect(0,0,W,H);
    g.fillStyle='#20232a';g.fillRect(0,H-1,W,1);
    for(let k=0;k<Math.min(i,tl.length);k++){
      const d=new Date(tl[k].bucket+'T00:00:00');
      const x=(d-t0)/864e5/days*(W-8)+4;
      const h=Math.max(2,Math.sqrt(tl[k].calls/max)*(H-26));
      g.fillStyle=tl[k].calls>=max*.5?'#e8a33d':'#8a6224';
      g.fillRect(x,H-4-h,bw,h);
    }
  }
  if(reduceMotion)frame(tl.length);
  else{const t=performance.now();(function anim(){const p=Math.min(1,(performance.now()-t)/1200);
    frame(Math.ceil(p*p*(2-1)*tl.length));if(p<1)requestAnimationFrame(anim)})()}
  const ax=document.getElementById('river-axis');
  ax.innerHTML=[0,.25,.5,.75,1].map(p=>{const d=new Date(+t0+p*(t1-t0));
    return `<span>${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}</span>`}).join('');
  cv.onmousemove=e=>{const r=cv.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width, d=new Date(+t0+x*days*864e5);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    tip.style.opacity=1;tip.style.left=Math.min(e.clientX-r.left,W-130)+'px';tip.style.top='-6px';
    tip.innerHTML=`${key} · ${byDay[key]||0} 通`};
  cv.onmouseleave=()=>tip.style.opacity=0;
  cv.onclick=e=>{const r=cv.getBoundingClientRect();
    const d=new Date(+t0+((e.clientX-r.left)/r.width)*days*864e5);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    qp={page:1,size:25,date_from:key,date_to:key};cur='calls';renderNav();calls(true)};
}

/* ================= 找通话 ================= */
let qp={page:1,size:25};
async function calls(preset){
  const srcs=await J('/api/sources').catch(()=>[]);
  V.innerHTML=`<div class="bar">
    <input id="q" placeholder="说过的话，全文找" style="width:250px" value="${esc(qp.q||'')}">
    <input id="ct" placeholder="联系人或号码" style="width:150px" value="${esc(qp.contact||'')}">
    <input id="f" type="date" value="${esc(qp.date_from||'')}"><span class="muted">到</span><input id="t" type="date" value="${esc(qp.date_to||'')}">
    <select id="who"><option value="">谁说的都行</option>
      <option value="me"${qp.who=='me'?' selected':''}>我说过话的</option>
      <option value="other"${qp.who=='other'?' selected':''}>对方说过话的</option></select>
    ${srcs.length>1?`<select id="src"><option value="">所有录音库</option>${
      srcs.map(s=>`<option value="${s.id}"${qp.source==s.id?' selected':''}>${esc(s.name)}</option>`).join('')}</select>`:''}
    <button class="btn" id="go">找</button></div>
    <div id="list" class="card">输入条件，或直接点总览页的「通话长河」定位某天。</div>`;
  const go=()=>{qp={page:1,size:25,q:V.querySelector('#q').value,contact:V.querySelector('#ct').value,
    date_from:V.querySelector('#f').value,date_to:V.querySelector('#t').value,
    who:V.querySelector('#who').value,source:(V.querySelector('#src')||{}).value||''};render()};
  V.querySelector('#go').onclick=go;V.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()});
  async function render(){
    const p=new URLSearchParams(Object.entries(qp).filter(x=>x[1]!==''));
    const d=await J('/api/calls?'+p);
    const el=V.querySelector('#list');
    if(!d.items.length){el.innerHTML='<div class="muted" style="padding:22px 6px">没有符合条件的通话。换个日期或清空联系人再试。</div>';return}
    el.innerHTML=`<table><tr><th>什么时候</th><th>和谁</th><th>多长</th><th>状态</th><th>聊了什么</th><th>文件</th></tr>`+
      d.items.map(c=>`<tr class="row" data-id="${c.id}" tabindex="0"><td class="time num">${fmt(c.call_time)}</td>
      <td>${esc(c.contact||c.contact_hint||c.phone||'—')}</td>
      <td class="num">${dur(c.duration_sec)}</td>
      <td><span class="pill ${/analyzed|transcribed/.test(c.status)?'done':c.status=='error'?'err':''}">${
        c.status=='pending'?'待处理':c.status=='error'?'出错':c.status=='analyzed'?'已摘要':'已转写'}</span></td>
      <td class="sum">${esc((c.summary||'').slice(0,60))}</td><td class="fn">${esc(c.filename)}</td></tr>`).join('')+
      `</table><div class="pager"><button class="btn" id="prev">上一页</button>
      <span class="num">${d.page} / ${Math.max(1,Math.ceil(d.total/d.size))} 页 · 共 ${d.total} 通</span>
      <button class="btn" id="next">下一页</button></div>`;
    el.querySelectorAll('tr.row').forEach(tr=>{tr.onclick=()=>detail(+tr.dataset.id);
      tr.onkeydown=e=>{if(e.key==='Enter')detail(+tr.dataset.id)}});
    el.querySelector('#prev').onclick=()=>{if(qp.page>1){qp.page--;render()}};
    el.querySelector('#next').onclick=()=>{if(qp.page*qp.size<d.total){qp.page++;render()}};
  }
  if(preset){V.querySelector('#f').value=qp.date_from||'';V.querySelector('#t').value=qp.date_to||''}
  render();
}
async function detail(id){
  document.getElementById('detail')?.remove();
  const c=await J('/api/calls/'+id);
  const el=document.createElement('div');
  el.className='card';el.id='detail';
  let ana={};try{ana=JSON.parse(c.analysis||'{}')}catch(e){}
  el.innerHTML=`<div class="head"><b class="num">${fmt(c.call_time)}</b>
    <span>${esc(c.contact_hint||c.phone||c.filename)}</span>
    <span class="muted num">${dur(c.duration_sec)}</span>
    <button class="btn" id="close" style="margin-left:auto">收起</button></div>
    <audio controls preload="none" src="/api/media/${id}"></audio>
    ${c.summary?`<div class="summary">${esc(c.summary)}
      ${(ana.topics||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
      ${(ana.todos||[]).length?`<div class="todos"><b>待办</b><br>${(ana.todos||[]).map(t=>'· '+esc(t)).join('<br>')}</div>`:''}</div>`:''}
    <div id="seglist">${(c.segments||[]).map(s=>`<div class="seg ${s.who}">
      <span class="who">${s.who=='me'?'我':esc(s.contact_name||'对方')}<span class="t num">${new Date(s.start_ms).toISOString().substr(11,8)}</span></span><br>${esc(s.text_zh)}</div>`).join('')
      ||'<div class="muted">这通还没转写。等后台跑批完成后回来听。</div>'}</div>`;
  V.appendChild(el);el.scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});
  el.querySelector('#close').onclick=()=>el.remove();
}

/* ================= 关系图谱 · 总机跳线盘（自绘 canvas 力导向） ================= */
async function graph(){
  V.innerHTML=`<div class="bar">
    <input id="gsince" type="date"><span class="muted">到</span><input id="guntil" type="date">
    <input id="gsearch" placeholder="找一个人名/事件，回车定位" style="width:190px">
    <button class="btn" id="ggo">筛选这段时间</button>
    <button class="btn" id="greset">复位视角</button></div>
    <div id="graphbox"><canvas id="gx"></canvas>
      <div class="g-hud" id="g-legend">
        <span><i style="background:#e8a33d;box-shadow:0 0 8px 2px rgba(232,163,61,.5)"></i>我（总机）</span>
        <span><i style="background:#63b3a5"></i>联系人 · 越大打得越多</span>
        <span><i class="dia" style="background:#c9b28a"></i>事件</span>
        <span><i style="background:#7f8ea3"></i>话题</span>
        <span class="muted">跳线越粗话务越多 · 拖拽/滚轮缩放 · 单击看线路卡 · 双击跳检索</span></div>
      <div class="g-hud" id="g-count"></div>
      <div id="g-tip"></div>
      <div id="g-card"></div></div>
    <h2>事件时间线</h2><div class="card" id="evlist" style="padding:4px 16px"></div>`;
  const q=new URLSearchParams();
  const s=V.querySelector('#gsince').value,u=V.querySelector('#guntil').value;
  if(s)q.set('since',s);if(u)q.set('until',u+'T23:59:59');
  const g=await J('/api/graph?'+q);
  V.querySelector('#ggo').onclick=graph;

  const COL={me:'#e8a33d',contact:'#63b3a5',event:'#c9b28a',topic:'#7f8ea3'};
  const nodes=g.nodes.map((n,i)=>{
    const a=i*2.399963,r=46*Math.sqrt(i+1);
    return {id:n.data.id,label:n.data.label,type:n.data.type,deg:n.data.deg||1,
      w:0,call_id:null,t:null,x:Math.cos(a)*r,y:Math.sin(a)*r,vx:0,vy:0,fx:null,fy:null,
      r:n.data.type==='me'?24:n.data.type==='contact'?Math.min(24,6+2.1*Math.sqrt(n.data.deg||1)):n.data.type==='event'?5:3.5};
  });
  const byId=new Map(nodes.map(n=>[n.id,n]));
  const edges=[];
  for(const e of g.edges){
    const a=byId.get(e.data.source),b=byId.get(e.data.target);
    if(!a||!b)continue;
    const w=e.data.weight||1;
    edges.push({a,b,kind:e.data.kind,w,time:e.data.time,call_id:e.data.call_id});
    if(e.data.kind==='talked'){const c=a.type==='contact'?a:b;c.w+=w;c.t=c.t||e.data.time;}
    if(e.data.kind==='involves'){const c=a.type==='contact'?a:(b.type==='contact'?b:null);if(c)c.t=c.t||e.data.time;}
  }
  const nbr=new Map(nodes.map(n=>[n.id,new Set()]));
  for(const e of edges){nbr.get(e.a.id).add(e.b.id);nbr.get(e.b.id).add(e.a.id);}
  V.querySelector('#g-count').textContent=`${nodes.length} 节点 · ${edges.length} 条跳线`;

  const cv=V.querySelector('#gx'),box=V.querySelector('#graphbox');
  const tip=V.querySelector('#g-tip'),card=V.querySelector('#g-card');
  const dpr=devicePixelRatio||1;let W=0,H=0;
  const cam={x:0,y:0,k:1};
  function fit(){W=box.clientWidth;H=box.clientHeight;cv.width=W*dpr;cv.height=H*dpr;}
  fit();
  function onRz(){if(!box.isConnected){removeEventListener('resize',onRz);return}fit();heat(0.5)}
  addEventListener('resize',onRz);
  const S=(wx,wy)=>[W/2+(wx+cam.x)*cam.k,H/2+(wy+cam.y)*cam.k];
  const Ws=(sx,sy)=>[(sx-W/2)/cam.k-cam.x,(sy-H/2)/cam.k-cam.y];

  /* --- 物理 --- */
  let alpha=1;
  const heat=a=>{alpha=Math.max(alpha,a);if(!ticking)tick()};
  function step(){
    alpha*=0.986;if(alpha<0.015)alpha=0;
    if(!alpha)return;
    for(const e of edges){
      const d=Math.hypot(e.b.x-e.a.x,e.b.y-e.a.y)||1;
      const want=e.kind==='talked'?Math.max(95,215-9*Math.sqrt(e.w)):e.kind==='topic'?255:70;
      const f=(d-want)/d*alpha*(e.kind==='talked'?0.055:0.035);
      const fx=(e.b.x-e.a.x)*f,fy=(e.b.y-e.a.y)*f;
      if(e.a.type!=='me'){e.a.vx+=fx;e.a.vy+=fy}
      if(e.b.type!=='me'){e.b.vx-=fx;e.b.vy-=fy}
    }
    for(let i=0;i<nodes.length;i++){const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){const b=nodes[j];
        let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
        if(d2>160000||d2<1)continue;
        const d=Math.sqrt(d2),f=1700*alpha/d2/d;
        const fx=dx*f,fy=dy*f;
        a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
      }}
    for(const n of nodes){
      if(n.type==='me'){n.x=0;n.y=0;continue}
      n.vx-=n.x*(n.type==='topic'?0.0016:0.0032)*alpha*10;
      n.vy-=n.y*(n.type==='topic'?0.0016:0.0032)*alpha*10;
      if(n.fx!=null){n.x=n.fx;n.y=n.fy;n.vx=n.vy=0;continue}
      n.vx*=0.82;n.vy*=0.82;n.x+=n.vx;n.y+=n.vy;
    }
  }

  /* --- 绘制 --- */
  let hover=null,selected=null,pulseT=0,ticking=false;
  function curve(e){ // 弯曲控制点：固定哈希决定弯向
    const mx=(e.a.x+e.b.x)/2,my=(e.a.y+e.b.y)/2;
    const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.hypot(dx,dy)||1;
    const h=(parseInt(e.a.id,10)*7+parseInt(e.b.id,10)*13)%2?1:-1;
    const off=Math.min(34,d*0.13)*h;
    return [mx-dy/d*off,my+dx/d*off];
  }
  function draw(){
    ctx0();
    for(const e of edges){
      const focus=hover||selected;
      const inSet=focus&&(e.a===focus||e.b===focus);
      const dim=focus&&!inSet;
      let al=inSet?0.95:dim?0.07:0.34;
      const [cx1,cy1]=curve(e);
      const p0=S(e.a.x,e.a.y),p1=S(cx1,cy1),p2=S(e.b.x,e.b.y);
      ctx.beginPath();ctx.moveTo(...p0);ctx.quadraticCurveTo(...p1,...p2);
      if(e.kind==='talked'){
        const grd=ctx.createLinearGradient(p0[0],p0[1],p2[0],p2[1]);
        const ca=hexA(COL.me,al),cb=hexA(COL.contact,al);
        if(e.a.type==='me'){grd.addColorStop(0,ca);grd.addColorStop(1,cb)}
        else{grd.addColorStop(0,cb);grd.addColorStop(1,ca)}
        ctx.strokeStyle=grd;
      }else ctx.strokeStyle=hexA(e.kind==='involves'?COL.event:COL.topic,al*0.8);
      ctx.lineWidth=Math.max(0.5,(0.5+Math.log2(1+e.w)*0.75))*cam.k;
      ctx.stroke();
      if(inSet&&!reduceMotion){ // 信号光点沿跳线行进
        const t=(pulseT*(0.4+Math.min(1.4,Math.log2(1+e.w)*0.3)))%1;
        const q=bq(p0,p1,p2,t);
        ctx.beginPath();ctx.arc(q[0],q[1],2.6*cam.k+1,0,7);
        ctx.fillStyle=e.kind==='talked'?COL.me:COL.event;ctx.globalAlpha=0.9;ctx.fill();ctx.globalAlpha=1;
      }
    }
    for(const n of nodes){
      const [x,y]=S(n.x,n.y);
      const focus=hover||selected;
      const isF=focus&&n===focus;
      const isNb=focus&&nbr.get(focus.id).has(n.id);
      const dim=focus&&!isF&&!isNb;
      const r=n.r*cam.k;
      if(x<-40||x>W+40||y<-40||y>H+40)continue;
      if(n.type==='me'){ // 总机呼吸光晕（唯一常驻动效）
        const breathe=reduceMotion?0:Math.sin(pulseT*Math.PI*2)*3;
        const gl=ctx.createRadialGradient(x,y,r*0.4,x,y,r*2.6+breathe*cam.k);
        gl.addColorStop(0,hexA(COL.me,dim?0.12:0.5));gl.addColorStop(1,hexA(COL.me,0));
        ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,y,r*2.6+breathe*cam.k,0,7);ctx.fill();
      }else if((isF||isNb)&&cam.k>0.5){
        ctx.fillStyle=hexA(COL[n.type]||'#888',0.16);
        ctx.beginPath();ctx.arc(x,y,r+5,0,7);ctx.fill();
      }
      ctx.globalAlpha=dim?0.16:1;
      ctx.fillStyle=COL[n.type]||'#888';
      if(n.type==='event'){ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);
        ctx.fillRect(-r,-r,r*2,r*2);ctx.restore();}
      else if(n.type==='topic'){ctx.globalAlpha=dim?0.12:0.55;
        ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
      else{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
      if(n===selected){ctx.strokeStyle='#e9e6df';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(x,y,r+4,0,7);ctx.stroke();}
      const showLab=n.type==='me'||isF||isNb||(n.type==='contact'&&cam.k*n.r>9);
      if(showLab){
        ctx.font=(n.type==='me'?'700 13px ':'11px ')+"'Space Grotesk','Microsoft YaHei'";
        ctx.textAlign='center';
        ctx.fillStyle=dim?'#5c6067':(n.type==='me'?'#e8a33d':'#cfd3d9');
        ctx.fillText(n.label,x,y+r+13);
      }
      ctx.globalAlpha=1;
    }
  }
  const ctx=cv.getContext('2d');
  function ctx0(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);}
  const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);
    return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
  const bq=(p0,p1,p2,t)=>{const m=1-t;
    return [m*m*p0[0]+2*m*t*p1[0]+t*t*p2[0],m*m*p0[1]+2*m*t*p1[1]+t*t*p2[1]]};
  function tick(){ticking=true;
    (function loop(){
      if(!box.isConnected){ticking=false;return}
      if(alpha>0)step();
      if(!reduceMotion)pulseT=(pulseT+0.0035)%1;
      draw();
      ticking=alpha>0||hover||selected||!reduceMotion;
      if(ticking)requestAnimationFrame(loop);})();}

  /* --- 交互 --- */
  function pick(sx,sy){const [wx,wy]=Ws(sx,sy);
    for(let i=nodes.length-1;i>=0;i--){const n=nodes[i];
      const d=Math.hypot(n.x-wx,n.y-wy);if(d<=n.r+6/cam.k)return n;}
    return null;}
  let drag=null,pan=null,moved=0;
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);moved=0;
    const n=pick(e.offsetX,e.offsetY);
    if(n){drag=n;n.fx=n.x;n.fy=n.y;}else pan={x:e.offsetX,y:e.offsetY,cx:cam.x,cy:cam.y};
    cv.classList.add('dragging')});
  cv.addEventListener('pointermove',e=>{moved++;
    if(drag){const [wx,wy]=Ws(e.offsetX,e.offsetY);drag.fx=wx;drag.fy=wy;heat(0.25);}
    else if(pan){cam.x=pan.cx+(e.offsetX-pan.x)/cam.k;cam.y=pan.cy+(e.offsetY-pan.y)/cam.k;}
    else{hover=pick(e.offsetX,e.offsetY);cv.style.cursor=hover?'pointer':'grab';
      tip.style.opacity=hover?1:0;
      if(hover){tip.style.left=(e.offsetX+14)+'px';tip.style.top=(e.offsetY-8)+'px';
        tip.textContent=hover.type==='me'?'我（总机）':`${hover.label}${hover.w?' · '+hover.w+' 通':''}`;}
      if(hover||!selected)heat(0.001);}});
  cv.addEventListener('pointerup',e=>{cv.classList.remove('dragging');
    if(drag){if(moved<3){select(drag)}drag.fx=drag.fy=null;drag=null;}
    else if(pan){if(moved<3){select(null)}pan=null;}
    heat(0.05)});
  cv.addEventListener('dblclick',e=>{const n=pick(e.offsetX,e.offsetY);if(!n)return;
    if(n.type==='contact'){qp={page:1,size:25,contact:n.label};cur='calls';renderNav();calls();}
    else if(n.type==='event'&&n.call_id){qp={page:1,size:25};cur='calls';renderNav();calls();setTimeout(()=>detail(n.call_id),150);}
    else if(n.type==='topic'){qp={page:1,size:25,q:n.label};cur='calls';renderNav();calls();}});
  cv.addEventListener('wheel',e=>{e.preventDefault();
    const [wx,wy]=Ws(e.offsetX,e.offsetY);
    cam.k=Math.min(4,Math.max(0.3,cam.k*Math.exp(-e.deltaY*0.0012)));
    cam.x=(e.offsetX-W/2)/cam.k-wx;
    cam.y=(e.offsetY-H/2)/cam.k-wy;},{passive:false});
  V.querySelector('#greset').onclick=()=>{cam.x=0;cam.y=0;cam.k=1;heat(0.3)};
  V.querySelector('#gsearch').onkeydown=e=>{if(e.key!=='Enter')return;
    const t=e.target.value.trim();
    const n=nodes.find(x=>x.label&&x.label.includes(t));
    if(n){select(n);cam.k=Math.max(cam.k,1.3);cam.x=-n.x;cam.y=-n.y;heat(0.02);}};

  function select(n){selected=n;
    if(!n){card.classList.remove('show');return}
    let kv='';
    if(n.type==='contact'){
      const evs=edges.filter(e=>e.kind==='involves'&&(e.a===n||e.b===n)).length;
      kv=`<div class="kv">与我有 <b>${n.w||'—'}</b> 通通话${n.t?` · 最近 <b>${fmt(String(n.t)).slice(0,10)}</b>`:''}</div>
        <div class="kv">牵涉事件 <b>${evs}</b> 个</div>
        <button class="btn" id="gc1">找这人的通话</button>`;
    }else if(n.type==='me'){
      kv=`<div class="kv">总机 · 关系枢纽，双击他人节点可跳检索</div>`;
    }else if(n.type==='event'){
      kv=`<div class="kv">${n.t?fmt(String(n.t)).slice(0,16):''}</div>
        ${n.call_id?'<button class="btn" id="gc1">回到那通电话</button>':''}`;
    }else{
      kv=`<div class="kv">话题标签</div><button class="btn" id="gc1">搜含此话题的通话</button>`;
    }
    card.innerHTML=`<div class="nm" style="color:${COL[n.type]||'#fff'}">${esc(n.label)}</div>${kv}`;
    card.classList.add('show');
    const b=card.querySelector('#gc1');
    if(b)b.onclick=()=>{
      if(n.type==='contact'){qp={page:1,size:25,contact:n.label};cur='calls';renderNav();calls()}
      else if(n.type==='event'){qp={page:1,size:25};cur='calls';renderNav();calls();setTimeout(()=>detail(n.call_id),150)}
      else{qp={page:1,size:25,q:n.label};cur='calls';renderNav();calls()}};
    heat(0.001);}

  /* 事件需要 call_id/time（node 本身无，从边补） */
  for(const e of edges){if(e.kind==='involves'){
    const ev=e.a.type==='event'?e.a:e.b.type==='event'?e.b:null;
    if(ev){if(e.call_id&&!ev.call_id)ev.call_id=e.call_id;if(e.time&&!ev.t)ev.t=e.time;}}}

  if(nodes.length){heat(1)}
  else{V.querySelector('#g-count').textContent='还没有图谱数据：等转写+标注+摘要跑完后运行 pipeline.py graph';}

  const evs=await J('/api/events?limit=15');
  V.querySelector('#evlist').innerHTML=evs.map(e=>`<div class="evrow"><span class="t">${fmt(e.event_time)}</span><b>${esc(e.title)}</b> <span class="muted">${esc(e.participants||'')}</span></div>`).join('')
    ||'<div class="muted" style="padding:16px 4px">摘要跑完后，这里会按时间列出你经历的事。</div>';
}

async function voices(){
  const vs=await J('/api/voices');
  V.innerHTML=`<h2>音色文件 · 每段 6~18 秒干净人声，配对应文本，可直接用于千问 TTS 声音复刻</h2>
  <div class="card">${vs.map(v=>`<div class="vrow">
    <div class="av">${esc((v.speaker||'?')[0])}</div>
    <div style="flex:1"><b>${esc(v.speaker)}</b> <span class="vmeta num">${v.clips.length} 段 / ${v.total_sec}s · data/voices/${esc(v.dir)}</span>
    ${v.clips.map(c=>`<div style="margin-top:8px"><audio controls preload="none" src="${c.url}"></audio>
      <div class="vmeta">${esc(c.text)}</div></div>`).join('')}</div></div>`).join('')
    ||'<div class="muted" style="padding:22px 6px">还没有音色文件。等转写与标注完成后，运行 <b>python pipeline.py voices</b> 生成。</div>'}</div>`;
}

/* ================= 录音库（外部目录/NAS） ================= */
let scanPoll=null;
async function sources(){
  const vs=await J('/api/sources');
  V.innerHTML=`<h2>录音库 · 本机目录或已挂载的 NAS，添加后点「扫描入库」即可增量收录</h2>
  <div class="bar" style="margin:0 0 14px">
    <input id="nname" placeholder="库名称，如：NAS-旧手机录音" style="width:200px">
    <input id="npath" placeholder="路径，如：\\\\NAS\\recordings 或 Z:\\callrec" style="width:340px">
    <button class="btn" id="add">添加录音库</button>
    <span id="msg" class="muted"></span></div>
  <div class="card"><table><tr><th>名称</th><th>路径</th><th>通话数</th><th>时长</th><th>已转写</th><th>出错</th><th>上次扫描</th><th>操作</th></tr>
  ${vs.map(s=>`<tr><td><b>${esc(s.name)}</b>${s.enabled?'':' <span class="pill">已停用</span>'}</td>
    <td class="fn" style="max-width:300px" title="${esc(s.path)}">${esc(s.path)}</td>
    <td class="num"><a href="#" data-view="${s.id}">${s.n_calls}</a></td>
    <td class="num">${s.hours??'—'}h</td><td class="num">${s.n_done}</td>
    <td class="num">${s.n_err||'—'}</td>
    <td class="num" style="font-size:12px">${s.last_scan_at?fmt(s.last_scan_at):'未扫描'}</td>
    <td style="white-space:nowrap"><button class="btn" data-scan="${s.id}">扫描入库</button>
      <button class="btn" data-toggle="${s.id}" data-on="${s.enabled}">${s.enabled?'停用':'启用'}</button>
      <button class="btn" data-del="${s.id}">移除</button></td></tr>`).join('')}
  </table></div>
  <div class="muted" style="margin-top:10px;font-size:12px">扫描只登记新文件与变化文件，不会动已有转写结果；NAS 换挂载盘符时，编辑路径后重新扫描即可（若路径变化导致重复登记，请到数据库层面处理）。</div>`;
  const msg=V.querySelector('#msg');
  V.querySelector('#add').onclick=async()=>{
    const name=V.querySelector('#nname').value.trim(),path=V.querySelector('#npath').value.trim();
    if(!name||!path){msg.textContent='名称和路径都要填';return}
    msg.textContent='添加中…';
    const r=await fetch('/api/sources',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,path})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){msg.textContent='失败：'+(j.detail||r.status);return}
    sources();
  };
  V.querySelectorAll('[data-view]').forEach(a=>a.onclick=e=>{e.preventDefault();
    qp={page:1,size:25,source:a.dataset.view};cur='calls';renderNav();calls()});
  V.querySelectorAll('[data-scan]').forEach(b=>b.onclick=async()=>{
    const r=await fetch(`/api/sources/${b.dataset.scan}/scan`,{method:'POST'});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){msg.textContent=j.detail||'启动扫描失败';return}
    msg.textContent='扫描中（含时长探测，文件多时需几分钟）…';b.disabled=true;
    clearInterval(scanPoll);
    scanPoll=setInterval(async()=>{
      const st=await J('/api/sources/scan-status');
      if(!st.running){clearInterval(scanPoll);msg.textContent='扫描完成：'+st.message;sources()}
      else msg.textContent='扫描中… '+st.message},2000)});
  V.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{
    await fetch('/api/sources/'+b.dataset.toggle,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({enabled:b.dataset.on==='1'?0:1})});sources()});
  V.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    let q='/api/sources/'+b.dataset.del;
    if(!confirm('移除这个录音库记录？'))return
    const r=await fetch(q,{method:'DELETE'});const j=await r.json().catch(()=>({}));
    if(!r.ok){if(confirm(j.detail+'\\n仅移除库记录（保留通话）？')){
        const r2=await fetch(q+'?unlink=1',{method:'DELETE'});
        if(r2.ok)sources();else msg.textContent='删除失败'}return}
    sources()});
}

const P={dash,calls,graph,voices,sources};
